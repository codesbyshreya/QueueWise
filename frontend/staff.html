<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Staff Dashboard | QueueWise</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="navbar"><a class="brand" href="index.html"><span class="brand-mark">Q</span> QueueWise</a><nav><a href="customer.html">Customer view</a><a href="analytics.html">Analytics</a></nav></header>
<main class="dashboard-page">
  <div class="page-heading page-heading-row"><div><span class="eyebrow">STAFF WORKSPACE</span><h1>Queue control</h1><p>Manage waiting customers and update ticket status.</p></div><span class="pill pill-demo">DEMO MODE</span></div>
  <div class="summary-grid"><div class="summary-card"><span class="muted">Waiting</span><strong id="waitingCount">3</strong><small>Customers in queue</small></div><div class="summary-card"><span class="muted">Now serving</span><strong id="staffServing">A011</strong><small>Current ticket</small></div><div class="summary-card"><span class="muted">Completed</span><strong id="completedCount">8</strong><small>Demo total</small></div></div>
  <section class="panel table-panel"><div class="panel-top"><div><h2>Current queue</h2><p class="muted">Actions update this page's demo state only.</p></div><button class="btn btn-primary" id="callNextBtn">Call next →</button></div>
    <div class="table-scroll"><table><thead><tr><th>Token</th><th>Service</th><th>Joined</th><th>Status</th><th>Actions</th></tr></thead><tbody id="queueBody"></tbody></table></div>
    <p id="staffMessage" class="form-message" aria-live="polite"></p>
  </section>
</main><script src="js/app.js"></script><script src="js/staff.js"></script>
</body></html>
